version: 2

sources:
  - name: sales_intelligence
    database: SALES_INTELLIGENCE
    schema: DATA
    tables:
      - name: SALES_METRICS
        config:
          tags: ['sales', 'daily']
          loaded_at_field: loaded_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour